name: teamfund

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: teamfund
      POSTGRES_USER: teamfund
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamfund -d teamfund"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The whole application: domain layer, Telegram bots, webhooks and scheduled jobs.
  app:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://teamfund:${POSTGRES_PASSWORD}@db:5432/teamfund
      PUBLIC_URL: https://${PUBLIC_HOST}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
