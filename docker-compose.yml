name: teamfund

# Docker keeps container logs forever by default; cap each container at 3 files of 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: teamfund
      POSTGRES_USER: teamfund
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamfund -d teamfund"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The whole application: domain layer, Telegram bots, webhooks and scheduled jobs.
  app:
    logging: *logging
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://teamfund:${POSTGRES_PASSWORD}@db:5432/teamfund
      PUBLIC_URL: https://${PUBLIC_HOST}
      BACKUP_DIR: /backups
    volumes:
      # read-only: /ops and the daily check only look at the newest backup's date and size
      - ${HOME}/backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy

  caddy:
    logging: *logging
    image: caddy:2.8.4
    restart: unless-stopped
    # --watch: Caddy reloads by itself whenever caddy/Caddyfile changes (edit or git pull).
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    ports:
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      # mount the folder, not the file: editors replace the file, and a file mount keeps the old one
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
