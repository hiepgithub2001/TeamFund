<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" role="img" aria-label="Sequence: a member starts the bot, selects names, receives a SePay QR with a unique code, transfers money, SePay sends a webhook to the Core API, which matches the code and amount, marks the bills paid, and the bot sends a receipt and posts to the group."><style>svg{
  --bg:#f5f7f8; --surface:#ffffff; --fg:#17212b; --muted:#5b6b78; --line:#c9d3db;
  --tg:#2b7bb9; --tg-soft:#eaf3fa; --money:#b8730f; --money-soft:#fbf1df;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
;color:var(--fg);font-family:Inter,system-ui,sans-serif}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.box.tg{stroke:var(--tg)}
.box.in{fill:var(--tg-soft);stroke:var(--tg);stroke-width:1}
.box.mo{stroke:var(--money);fill:var(--money-soft)}
.box.ghost{fill:none;stroke:var(--line);stroke-dasharray:4 3}
.box.hot{fill:var(--tg-soft);stroke:var(--tg);stroke-width:2}
.box.file{fill:var(--bg);stroke:var(--line)}
.lane{fill:var(--bg);stroke:none}
.lane-line{stroke:var(--line);stroke-width:1}
.ln.tg{stroke:var(--tg)}
.ln.out{stroke:var(--tg);stroke-dasharray:6 4}
.head-tg{fill:var(--tg)}
.lb.tgc{fill:var(--tg)}
.s.ghost{fill:var(--muted);font-style:italic}
.zone{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 5}
.zone.tg{stroke:var(--tg)}
.t{font:600 13px var(--body);fill:currentColor}
.s{font:400 11px var(--body);fill:var(--muted)}
.lb{font:500 11px var(--mono);fill:var(--muted)}
.lb.m{fill:var(--money)}
.lb.z{fill:var(--tg)}
.ln{fill:none;stroke:currentColor;stroke-width:1.4}
.ln.m{stroke:var(--money);stroke-width:2}
.ln.d{stroke-dasharray:5 4}
.life{stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 4}
.head-fg{fill:currentColor}
.head-m{fill:var(--money)}</style><rect width="100%" height="100%" fill="#ffffff"/>
      <defs>
        <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="head-fg"/></marker>
        <marker id="bm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="head-m"/></marker>
      </defs>
      <rect class="box" x="15" y="16" width="130" height="40" rx="8"/><text class="t" x="80" y="41" text-anchor="middle">Member</text>
      <rect class="box tg" x="205" y="16" width="130" height="40" rx="8"/><text class="t" x="270" y="41" text-anchor="middle">Team bot</text>
      <rect class="box" x="395" y="16" width="130" height="40" rx="8"/><text class="t" x="460" y="41" text-anchor="middle">Core API</text>
      <rect class="box mo" x="585" y="16" width="130" height="40" rx="8"/><text class="t" x="650" y="41" text-anchor="middle">Bank</text>
      <rect class="box mo" x="775" y="16" width="130" height="40" rx="8"/><text class="t" x="840" y="41" text-anchor="middle">SePay</text>
      <line class="life" x1="80" y1="56" x2="80" y2="585"/>
      <line class="life" x1="270" y1="56" x2="270" y2="585"/>
      <line class="life" x1="460" y1="56" x2="460" y2="585"/>
      <line class="life" x1="650" y1="56" x2="650" y2="585"/>
      <line class="life" x1="840" y1="56" x2="840" y2="585"/>

      <line class="ln" x1="80" y1="92" x2="268" y2="92" marker-end="url(#b)"/>
      <text class="lb" x="175" y="85" text-anchor="middle">1 · /start</text>
      <line class="ln" x1="270" y1="128" x2="458" y2="128" marker-end="url(#b)"/>
      <text class="lb" x="365" y="121" text-anchor="middle">2 · get unpaid bills</text>
      <line class="ln d" x1="460" y1="164" x2="272" y2="164" marker-end="url(#b)"/>
      <text class="lb" x="365" y="157" text-anchor="middle">3 · An, Bình, Cường…</text>
      <line class="ln" x1="270" y1="200" x2="82" y2="200" marker-end="url(#b)"/>
      <text class="lb" x="175" y="193" text-anchor="middle">4 · name buttons</text>
      <line class="ln" x1="80" y1="236" x2="268" y2="236" marker-end="url(#b)"/>
      <text class="lb" x="175" y="229" text-anchor="middle">5 · ✓An ✓Bình → Pay</text>
      <line class="ln" x1="270" y1="272" x2="458" y2="272" marker-end="url(#b)"/>
      <text class="lb" x="365" y="265" text-anchor="middle">6 · create intent [An, Bình]</text>
      <line class="ln d" x1="460" y1="308" x2="272" y2="308" marker-end="url(#b)"/>
      <text class="lb" x="365" y="301" text-anchor="middle">7 · code TFK7Q2M9 · 400,000đ</text>
      <line class="ln" x1="270" y1="344" x2="82" y2="344" marker-end="url(#b)"/>
      <text class="lb" x="175" y="337" text-anchor="middle">8 · SePay QR photo</text>

      <line class="ln m" x1="80" y1="380" x2="648" y2="380" marker-end="url(#bm)"/>
      <text class="lb m" x="365" y="373" text-anchor="middle">9 · transfer 400,000đ, memo TFK7Q2M9</text>
      <line class="ln m" x1="650" y1="416" x2="838" y2="416" marker-end="url(#bm)"/>
      <text class="lb m" x="745" y="409" text-anchor="middle">10 · incoming tx</text>
      <line class="ln m" x1="840" y1="452" x2="462" y2="452" marker-end="url(#bm)"/>
      <text class="lb m" x="650" y="445" text-anchor="middle">11 · webhook (Apikey header)</text>
      <polyline class="ln m" points="460,478 500,478 500,500 463,500" marker-end="url(#bm)"/>
      <text class="lb m" x="508" y="487">12 · match code + amount,</text>
      <text class="lb m" x="508" y="501">mark An, Bình paid</text>
      <line class="ln m" x1="460" y1="532" x2="272" y2="532" marker-end="url(#bm)"/>
      <text class="lb m" x="365" y="525" text-anchor="middle">13 · notify paid</text>
      <line class="ln" x1="270" y1="568" x2="82" y2="568" marker-end="url(#b)"/>
      <text class="lb" x="175" y="561" text-anchor="middle">14 · receipt + group post</text>
    </svg>
