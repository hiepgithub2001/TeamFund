<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="590" viewBox="0 0 1040 590" role="img" aria-label="The owner creates bots in BotFather and registers a team bot with the master bot. Members and followers use the team bots privately. All bots send updates through Telegram's Bot API to Caddy on the VPS, which passes them and SePay webhooks to one app process. Inside it, the interface adapters (webhooks, bots, scheduler) call the use cases, which apply the domain rules and reach PostgreSQL only through ports implemented by the infrastructure adapters."><style>svg{
  --bg:#f5f7f8; --surface:#ffffff; --fg:#17212b; --muted:#5b6b78; --line:#c9d3db;
  --tg:#2b7bb9; --tg-soft:#eaf3fa; --money:#b8730f; --money-soft:#fbf1df;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
;color:var(--fg);font-family:Inter,system-ui,sans-serif}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.box.tg{stroke:var(--tg)}
.box.in{fill:var(--tg-soft);stroke:var(--tg);stroke-width:1}
.box.mo{stroke:var(--money);fill:var(--money-soft)}
.box.ghost{fill:none;stroke:var(--line);stroke-dasharray:4 3}
.box.hot{fill:var(--tg-soft);stroke:var(--tg);stroke-width:2}
.box.file{fill:var(--bg);stroke:var(--line)}
.lane{fill:var(--bg);stroke:none}
.lane-line{stroke:var(--line);stroke-width:1}
.ln.tg{stroke:var(--tg)}
.ln.out{stroke:var(--tg);stroke-dasharray:6 4}
.head-tg{fill:var(--tg)}
.lb.tgc{fill:var(--tg)}
.s.ghost{fill:var(--muted);font-style:italic}
.zone{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 5}
.zone.tg{stroke:var(--tg)}
.t{font:600 13px var(--body);fill:currentColor}
.s{font:400 11px var(--body);fill:var(--muted)}
.lb{font:500 11px var(--mono);fill:var(--muted)}
.lb.m{fill:var(--money)}
.lb.z{fill:var(--tg)}
.ln{fill:none;stroke:currentColor;stroke-width:1.4}
.ln.dash{stroke-dasharray:3 3;opacity:.6}
.ln.m{stroke:var(--money);stroke-width:2}
.ln.d{stroke-dasharray:5 4}
.life{stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 4}
.head-fg{fill:currentColor}
.head-m{fill:var(--money)}</style><rect width="100%" height="100%" fill="#ffffff"/>
      <defs>
        <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head-fg"/></marker>
        <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head-m"/></marker>
      </defs>

      <!-- people -->
      <rect class="box" x="20" y="50" width="150" height="146" rx="8"/>
      <text class="t" x="95" y="112" text-anchor="middle">Owner</text>
      <text class="s" x="95" y="130" text-anchor="middle">creates + registers</text>
      <text class="s" x="95" y="145" text-anchor="middle">the team bot</text>

      <rect class="box" x="20" y="230" width="150" height="56" rx="8"/>
      <text class="t" x="95" y="254" text-anchor="middle">Followers</text>
      <text class="s" x="95" y="271" text-anchor="middle">paid posts, reminders</text>

      <rect class="box" x="20" y="300" width="150" height="56" rx="8"/>
      <text class="t" x="95" y="324" text-anchor="middle">Members, managers</text>
      <text class="s" x="95" y="341" text-anchor="middle">pay · manage team</text>

      <!-- telegram -->
      <rect class="zone tg" x="210" y="24" width="190" height="346" rx="12"/>
      <text class="lb z" x="224" y="44">TELEGRAM BOT API</text>

      <rect class="box" x="228" y="50" width="154" height="56" rx="8"/>
      <text class="t" x="305" y="74" text-anchor="middle">@BotFather</text>
      <text class="s" x="305" y="91" text-anchor="middle">issues bot tokens</text>

      <rect class="box tg" x="228" y="140" width="154" height="56" rx="8"/>
      <text class="t" x="305" y="164" text-anchor="middle">Master bot</text>
      <text class="s" x="305" y="181" text-anchor="middle">requests need approval</text>

      <rect class="box tg" x="238" y="232" width="154" height="104" rx="8"/>
      <rect class="box tg" x="228" y="242" width="154" height="104" rx="8"/>
      <text class="t" x="305" y="284" text-anchor="middle">Team bots</text>
      <text class="s" x="305" y="301" text-anchor="middle">@FCHiepBot, …</text>
      <text class="s" x="305" y="316" text-anchor="middle">one per team</text>

      <line class="ln" x1="172" y1="78" x2="225" y2="78" marker-end="url(#a)"/>
      <text class="lb" x="199" y="71" text-anchor="middle">/newbot</text>
      <line class="ln" x1="172" y1="168" x2="225" y2="168" marker-end="url(#a)"/>
      <text class="lb" x="199" y="161" text-anchor="middle">/request</text>
      <line class="ln" x1="172" y1="258" x2="225" y2="258" marker-start="url(#a)" marker-end="url(#a)"/>
      <text class="lb" x="199" y="251" text-anchor="middle">posts</text>
      <line class="ln" x1="172" y1="328" x2="225" y2="328" marker-start="url(#a)" marker-end="url(#a)"/>
      <text class="lb" x="199" y="321" text-anchor="middle">chat</text>

      <!-- money source -->
      <rect class="box mo" x="20" y="470" width="150" height="56" rx="8"/>
      <text class="t" x="95" y="494" text-anchor="middle">Bank app</text>
      <text class="s" x="95" y="511" text-anchor="middle">team fund account</text>
      <rect class="box mo" x="228" y="470" width="154" height="56" rx="8"/>
      <text class="t" x="305" y="494" text-anchor="middle">SePay</text>
      <text class="s" x="305" y="511" text-anchor="middle">one account per team</text>

      <line class="ln m" x1="95" y1="358" x2="95" y2="467" marker-end="url(#am)"/>
      <text class="lb m" x="103" y="408">scan QR,</text>
      <text class="lb m" x="103" y="422">transfer</text>
      <line class="ln m" x1="172" y1="498" x2="225" y2="498" marker-end="url(#am)"/>
      <text class="lb m" x="199" y="491" text-anchor="middle">tx</text>

      <!-- VPS -->
      <rect class="zone" x="440" y="24" width="580" height="551" rx="12"/>
      <text class="lb" x="456" y="562">VPS 103.90.225.28 · DOCKER COMPOSE</text>

      <rect class="box" x="465" y="60" width="110" height="300" rx="8"/>
      <text class="t" x="520" y="196" text-anchor="middle">Caddy</text>
      <text class="s" x="520" y="214" text-anchor="middle">HTTPS :443</text>
      <text class="s" x="520" y="229" text-anchor="middle">routes by path</text>

      <rect class="zone tg" x="640" y="40" width="365" height="345" rx="10"/>
      <text class="lb z" x="656" y="58">APP · ONE PYTHON PROCESS</text>

      <rect class="box in" x="655" y="68" width="335" height="48" rx="6"/>
      <text class="t" x="822" y="88" text-anchor="middle">interfaces/http · webhooks</text>
      <text class="s" x="822" y="106" text-anchor="middle">/tg/master · /tg/{bot} · /sepay/{team}</text>

      <rect class="box tg" x="655" y="145" width="160" height="60" rx="6"/>
      <text class="t" x="735" y="166" text-anchor="middle">interfaces/bot</text>
      <text class="s" x="735" y="183" text-anchor="middle">master + team bots</text>
      <text class="s" x="735" y="198" text-anchor="middle">menus, EN/VI texts</text>

      <rect class="box" x="830" y="145" width="160" height="60" rx="6"/>
      <text class="t" x="910" y="166" text-anchor="middle">interfaces/scheduler</text>
      <text class="s" x="910" y="183" text-anchor="middle">bills, late fees,</text>
      <text class="s" x="910" y="198" text-anchor="middle">reminders</text>

      <rect class="box hot" x="655" y="235" width="335" height="74" rx="6"/>
      <text class="t" x="822" y="256" text-anchor="middle">application/ use cases + domain/</text>
      <text class="s" x="822" y="273" text-anchor="middle">registration · teams · members · money · jobs</text>
      <text class="s" x="822" y="288" text-anchor="middle">entities · rules · role checks · ports</text>
      <text class="s" x="822" y="303" text-anchor="middle">no framework imports</text>

      <rect class="box" x="655" y="325" width="335" height="48" rx="6"/>
      <text class="t" x="822" y="345" text-anchor="middle">infrastructure/ · adapters</text>
      <text class="s" x="822" y="362" text-anchor="middle">SQLAlchemy repos · Fernet · SePay QR · xlsx</text>

      <rect class="box" x="660" y="470" width="200" height="70" rx="8"/>
      <text class="t" x="760" y="500" text-anchor="middle">PostgreSQL</text>
      <text class="s" x="760" y="518" text-anchor="middle">teams, admins, bills, tx, audit</text>

      <rect class="box" x="885" y="470" width="120" height="56" rx="8"/>
      <text class="t" x="945" y="494" text-anchor="middle">.env</text>
      <text class="s" x="945" y="511" text-anchor="middle">tokens, keys</text>

      <!-- telegram <-> vps -->
      <line class="ln" x1="402" y1="250" x2="462" y2="250" marker-end="url(#a)"/>
      <text class="lb" x="432" y="243" text-anchor="middle">updates</text>
      <polyline class="ln" points="700,38 700,32 403,32" marker-end="url(#a)"/>
      <text class="lb" x="540" y="46" text-anchor="middle">sendMessage, setWebhook</text>

      <line class="ln" x1="577" y1="86" x2="652" y2="86" marker-end="url(#a)"/>
      <text class="lb" x="614" y="79" text-anchor="middle">/tg/*</text>
      <line class="ln m" x1="577" y1="104" x2="652" y2="104" marker-end="url(#am)"/>
      <text class="lb m" x="614" y="120" text-anchor="middle">/sepay/*</text>

      <!-- inside the app -->
      <line class="ln" x1="735" y1="118" x2="735" y2="142" marker-end="url(#a)"/>
      <text class="lb" x="741" y="135">updates</text>
      <line class="ln m" x1="822" y1="118" x2="822" y2="232" marker-end="url(#am)"/>
      <line class="ln" x1="700" y1="207" x2="700" y2="232" marker-end="url(#a)"/>
      <text class="lb" x="706" y="224">calls</text>
      <line class="ln m" x1="785" y1="233" x2="785" y2="208" marker-end="url(#am)"/>
      <line class="ln" x1="910" y1="207" x2="910" y2="232" marker-end="url(#a)"/>
      <text class="lb" x="916" y="224">calls</text>
      <line class="ln" x1="822" y1="311" x2="822" y2="322" marker-end="url(#a)"/>
      <line class="ln" x1="760" y1="375" x2="760" y2="467" marker-start="url(#a)" marker-end="url(#a)"/>
      <text class="lb" x="768" y="428">SQL</text>
      <line class="ln" x1="945" y1="468" x2="945" y2="388" marker-end="url(#a)"/>
      <text class="lb" x="953" y="430">settings</text>

      <!-- sepay -> vps -->
      <polyline class="ln m" points="384,498 520,498 520,363" marker-end="url(#am)"/>
      <text class="lb m" x="452" y="491" text-anchor="middle">POST webhook</text>
    </svg>
