<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-label="Deployment: the sslip.io hostname resolves to 103.90.225.28. Telegram, SePay and Let's Encrypt reach port 443, where Docker forwards to the Caddy container. Caddy passes /tg and /sepay to the app container over the internal Docker network. The app, which holds the bots, the webhooks, the scheduler, the use cases and the adapters, uses the Postgres container, whose data lives in the db_data volume. The app calls api.telegram.org outbound. The project folder on the host holds .env, the Caddyfile, the source used for docker build, and the deploy and backup scripts, and syncs with GitHub over SSH."><style>svg{
  --bg:#f5f7f8; --surface:#ffffff; --fg:#17212b; --muted:#5b6b78; --line:#c9d3db;
  --tg:#2b7bb9; --tg-soft:#eaf3fa; --money:#b8730f; --money-soft:#fbf1df;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
;color:var(--fg);font-family:Inter,system-ui,sans-serif}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.box.tg{stroke:var(--tg)}
.box.in{fill:var(--tg-soft);stroke:var(--tg);stroke-width:1}
.box.mo{stroke:var(--money);fill:var(--money-soft)}
.box.ghost{fill:none;stroke:var(--line);stroke-dasharray:4 3}
.box.hot{fill:var(--tg-soft);stroke:var(--tg);stroke-width:2}
.box.file{fill:var(--bg);stroke:var(--line)}
.lane{fill:var(--bg);stroke:none}
.lane-line{stroke:var(--line);stroke-width:1}
.ln.tg{stroke:var(--tg)}
.ln.out{stroke:var(--tg);stroke-dasharray:6 4}
.head-tg{fill:var(--tg)}
.lb.tgc{fill:var(--tg)}
.s.ghost{fill:var(--muted);font-style:italic}
.zone{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 5}
.zone.tg{stroke:var(--tg)}
.t{font:600 13px var(--body);fill:currentColor}
.s{font:400 11px var(--body);fill:var(--muted)}
.lb{font:500 11px var(--mono);fill:var(--muted)}
.lb.m{fill:var(--money)}
.lb.z{fill:var(--tg)}
.ln{fill:none;stroke:currentColor;stroke-width:1.4}
.ln.m{stroke:var(--money);stroke-width:2}
.ln.d{stroke-dasharray:5 4}
.life{stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 4}
.head-fg{fill:currentColor}
.head-m{fill:var(--money)}</style><rect width="100%" height="100%" fill="#ffffff"/>
      <defs>
        <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head-fg"/></marker>
        <marker id="dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head-m"/></marker>
        <marker id="dt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head-tg"/></marker>
      </defs>

      <!-- internet column -->
      <text class="lb" x="20" y="28">INTERNET</text>
      <rect class="box" x="20" y="40" width="242" height="64" rx="8"/>
      <text class="t" x="141" y="62" text-anchor="middle">sslip.io DNS</text>
      <text class="s" x="141" y="79" text-anchor="middle">teamfund.103-90-225-28.sslip.io</text>
      <text class="s" x="141" y="94" text-anchor="middle">→ A 103.90.225.28 (from the name)</text>

      <rect class="box" x="20" y="130" width="242" height="64" rx="8"/>
      <text class="t" x="141" y="152" text-anchor="middle">Let's Encrypt</text>
      <text class="s" x="141" y="169" text-anchor="middle">TLS-ALPN-01 challenge on :443</text>
      <text class="s" x="141" y="184" text-anchor="middle">Caddy renews before expiry</text>

      <rect class="box tg" x="20" y="230" width="242" height="150" rx="8"/>
      <text class="t" x="141" y="262" text-anchor="middle">Telegram Bot API</text>
      <text class="s" x="141" y="280" text-anchor="middle">api.telegram.org</text>
      <text class="s" x="141" y="304" text-anchor="middle">master bot + one bot per team</text>
      <text class="s" x="141" y="320" text-anchor="middle">members' and managers' apps</text>
      <text class="s" x="141" y="336" text-anchor="middle">push updates to our webhooks,</text>
      <text class="s" x="141" y="352" text-anchor="middle">signed with a secret token</text>

      <rect class="box" x="20" y="410" width="242" height="50" rx="8"/>
      <text class="t" x="141" y="431" text-anchor="middle">qr.sepay.vn</text>
      <text class="s" x="141" y="448" text-anchor="middle">VietQR image; Telegram downloads it</text>

      <rect class="box mo" x="20" y="490" width="242" height="70" rx="8"/>
      <text class="t" x="141" y="512" text-anchor="middle">SePay</text>
      <text class="s" x="141" y="529" text-anchor="middle">watches each team's account</text>
      <text class="s" x="141" y="545" text-anchor="middle">POST webhook, Authorization: Apikey</text>

      <rect class="box mo" x="20" y="600" width="242" height="56" rx="8"/>
      <text class="t" x="141" y="623" text-anchor="middle">Team bank accounts</text>
      <text class="s" x="141" y="640" text-anchor="middle">members transfer here by QR</text>

      <rect class="box" x="20" y="730" width="242" height="70" rx="8"/>
      <text class="t" x="141" y="754" text-anchor="middle">GitHub</text>
      <text class="s" x="141" y="771" text-anchor="middle">hiepgithub2001/TeamFund</text>
      <text class="s" x="141" y="787" text-anchor="middle">branch main</text>

      <line class="ln" x1="141" y1="382" x2="141" y2="407" marker-end="url(#d)"/>
      <text class="lb" x="149" y="398">fetch QR</text>
      <line class="ln m" x1="141" y1="598" x2="141" y2="563" marker-end="url(#dm)"/>
      <text class="lb m" x="149" y="585">incoming tx</text>

      <!-- VPS -->
      <rect class="zone" x="320" y="20" width="860" height="825" rx="12"/>
      <text class="t" x="336" y="42">VPS 103.90.225.28 · Ubuntu 22.04 · Linux 5.15 · 4 GB RAM · 39 GB disk</text>

      <text class="lb" x="340" y="60">HOST PORTS</text>
      <rect class="box" x="340" y="66" width="130" height="38" rx="6"/>
      <text class="t" x="405" y="83" text-anchor="middle">22 · sshd</text>
      <text class="s" x="405" y="98" text-anchor="middle">admin login</text>
      <rect class="box ghost" x="340" y="122" width="130" height="48" rx="6"/>
      <text class="t" x="405" y="142" text-anchor="middle">80 · nginx</text>
      <text class="s ghost" x="405" y="159" text-anchor="middle">existing, untouched</text>

      <rect class="box hot" x="340" y="250" width="130" height="150" rx="6"/>
      <text class="t" x="405" y="300" text-anchor="middle">443/tcp</text>
      <text class="s" x="405" y="318" text-anchor="middle">docker-proxy</text>
      <text class="s" x="405" y="334" text-anchor="middle">→ caddy:443</text>
      <text class="s" x="405" y="358" text-anchor="middle">the only port</text>
      <text class="s" x="405" y="372" text-anchor="middle">we publish</text>

      <rect class="box ghost" x="340" y="440" width="130" height="44" rx="6"/>
      <text class="t" x="405" y="459" text-anchor="middle">8000 · other app</text>
      <text class="s ghost" x="405" y="475" text-anchor="middle">existing, untouched</text>
      <rect class="box ghost" x="340" y="500" width="130" height="52" rx="6"/>
      <text class="t" x="405" y="519" text-anchor="middle">5432 · host Postgres</text>
      <text class="s ghost" x="405" y="535" text-anchor="middle">localhost + Tailscale</text>
      <text class="s ghost" x="405" y="548" text-anchor="middle">not used by us</text>
      <rect class="box ghost" x="340" y="570" width="130" height="44" rx="6"/>
      <text class="t" x="405" y="589" text-anchor="middle">tailscale0</text>
      <text class="s ghost" x="405" y="605" text-anchor="middle">100.90.93.116</text>

      <!-- docker -->
      <rect class="zone tg" x="500" y="60" width="660" height="635" rx="10"/>
      <text class="lb z" x="516" y="80">DOCKER 29 · COMPOSE PROJECT teamfund · NETWORK teamfund_default</text>

      <rect class="box tg" x="520" y="270" width="170" height="114" rx="8"/>
      <text class="t" x="605" y="292" text-anchor="middle">caddy</text>
      <text class="s" x="605" y="309" text-anchor="middle">caddy:2.8.4</text>
      <text class="s" x="605" y="325" text-anchor="middle">TLS termination, HTTP/2</text>
      <text class="s" x="605" y="341" text-anchor="middle">/tg/* → app:8000</text>
      <text class="s" x="605" y="357" text-anchor="middle">/sepay/* → app:8000</text>
      <text class="s" x="605" y="373" text-anchor="middle">/health → ok, else 404</text>

      <rect class="box tg" x="760" y="90" width="380" height="332" rx="8"/>
      <text class="t" x="950" y="112" text-anchor="middle">app</text>
      <text class="s" x="950" y="129" text-anchor="middle">./server · python:3.12-slim · uvicorn :8000 · 1 worker</text>
      <rect class="box in" x="776" y="144" width="348" height="46" rx="6"/>
      <text class="t" x="950" y="163" text-anchor="middle">interfaces/http · webhooks</text>
      <text class="s" x="950" y="180" text-anchor="middle">/tg/master · /tg/{botId} · /sepay/{teamId}</text>
      <rect class="box in" x="776" y="204" width="168" height="62" rx="6"/>
      <text class="t" x="860" y="224" text-anchor="middle">interfaces/bot</text>
      <text class="s" x="860" y="241" text-anchor="middle">aiogram: master +</text>
      <text class="s" x="860" y="256" text-anchor="middle">team bots, EN/VI</text>
      <rect class="box in" x="956" y="204" width="168" height="62" rx="6"/>
      <text class="t" x="1040" y="224" text-anchor="middle">interfaces/scheduler</text>
      <text class="s" x="1040" y="241" text-anchor="middle">APScheduler in-process</text>
      <text class="s" x="1040" y="256" text-anchor="middle">:05 bills · 09:00 · 20:00</text>
      <rect class="box hot" x="776" y="280" width="348" height="62" rx="6"/>
      <text class="t" x="950" y="300" text-anchor="middle">application/ + domain/</text>
      <text class="s" x="950" y="317" text-anchor="middle">use cases and ports · entities and rules</text>
      <text class="s" x="950" y="332" text-anchor="middle">no framework imports</text>
      <rect class="box file" x="776" y="356" width="348" height="52" rx="6"/>
      <text class="t" x="950" y="376" text-anchor="middle">infrastructure/ · adapters</text>
      <text class="s" x="950" y="394" text-anchor="middle">SQLAlchemy · Fernet · SePay QR · xlsx</text>

      <rect class="box" x="760" y="500" width="192" height="80" rx="8"/>
      <text class="t" x="856" y="524" text-anchor="middle">db</text>
      <text class="s" x="856" y="541" text-anchor="middle">postgres:16-alpine</text>
      <text class="s" x="856" y="557" text-anchor="middle">:5432, Docker network only</text>
      <text class="s" x="856" y="572" text-anchor="middle">healthcheck pg_isready</text>

      <rect class="box file" x="520" y="430" width="170" height="34" rx="6"/>
      <text class="s" x="605" y="451" text-anchor="middle">volume caddy_data · certs</text>
      <rect class="box file" x="520" y="472" width="170" height="34" rx="6"/>
      <text class="s" x="605" y="493" text-anchor="middle">volume caddy_config</text>
      <rect class="box file" x="790" y="620" width="132" height="36" rx="6"/>
      <text class="s" x="856" y="642" text-anchor="middle">volume db_data</text>

      <!-- inbound -->
      <line class="ln" x1="262" y1="72" x2="317" y2="72" marker-end="url(#d)" stroke-dasharray="3 3"/>
      <text class="lb" x="290" y="65" text-anchor="middle">resolves</text>
      <polyline class="ln" points="264,162 300,162 300,268 337,268" marker-end="url(#d)"/>
      <text class="lb" x="282" y="155" text-anchor="middle">ACME</text>
      <line class="ln tg" x1="264" y1="305" x2="337" y2="305" marker-end="url(#dt)"/>
      <text class="lb tgc" x="300" y="298" text-anchor="middle">updates</text>
      <polyline class="ln m" points="264,525 300,525 300,385 337,385" marker-end="url(#dm)"/>
      <text class="lb m" x="282" y="518" text-anchor="middle">webhook</text>
      <line class="ln" x1="472" y1="325" x2="517" y2="325" marker-end="url(#d)"/>
      <text class="lb" x="494" y="318" text-anchor="middle">NAT</text>

      <!-- outbound to telegram -->
      <polyline class="ln out" points="758,112 285,112 285,245 265,245" marker-end="url(#dt)"/>
      <text class="lb tgc" x="620" y="105" text-anchor="middle">outbound HTTPS: sendMessage, sendPhoto, setWebhook</text>

      <!-- inside docker -->
      <polyline class="ln tg" points="692,300 725,300 725,160 773,160" marker-end="url(#dt)"/>
      <text class="lb tgc" x="719" y="225" text-anchor="end">/tg/*</text>
      <polyline class="ln m" points="692,355 742,355 742,178 773,178" marker-end="url(#dm)"/>
      <text class="lb m" x="700" y="374">/sepay/*</text>
      <line class="ln" x1="860" y1="192" x2="860" y2="202" marker-end="url(#d)"/>
      <line class="ln m" x1="950" y1="192" x2="950" y2="278" marker-end="url(#dm)"/>
      <line class="ln" x1="860" y1="268" x2="860" y2="278" marker-end="url(#d)"/>
      <line class="ln" x1="1040" y1="268" x2="1040" y2="278" marker-end="url(#d)"/>
      <line class="ln" x1="950" y1="344" x2="950" y2="354" marker-end="url(#d)"/>
      <line class="ln" x1="856" y1="424" x2="856" y2="497" marker-start="url(#d)" marker-end="url(#d)"/>
      <text class="lb" x="864" y="465">SQL (psycopg)</text>

      <line class="ln" x1="605" y1="386" x2="605" y2="427" marker-end="url(#d)"/>
      <text class="lb" x="613" y="410">mount</text>
      <line class="ln" x1="856" y1="582" x2="856" y2="617" marker-end="url(#d)"/>
      <text class="lb" x="864" y="604">mount</text>

      <!-- host files -->
      <rect class="zone" x="340" y="730" width="820" height="100" rx="10"/>
      <text class="lb" x="356" y="748">HOST FILES · ~/projects/teamfund (git clone of main)</text>
      <rect class="box file" x="356" y="758" width="150" height="56" rx="6"/>
      <text class="t" x="431" y="781" text-anchor="middle">scripts/deploy.sh</text>
      <text class="s" x="431" y="799" text-anchor="middle">pull → build → up → check</text>
      <rect class="box file" x="520" y="758" width="150" height="56" rx="6"/>
      <text class="t" x="595" y="781" text-anchor="middle">.env (chmod 600)</text>
      <text class="s" x="595" y="799" text-anchor="middle">tokens, keys, DB password</text>
      <rect class="box file" x="684" y="758" width="150" height="56" rx="6"/>
      <text class="t" x="759" y="781" text-anchor="middle">Caddyfile</text>
      <text class="s" x="759" y="799" text-anchor="middle">hostname, routes, TLS</text>
      <rect class="box file" x="848" y="758" width="150" height="56" rx="6"/>
      <text class="t" x="923" y="781" text-anchor="middle">server/</text>
      <text class="s" x="923" y="799" text-anchor="middle">code + Dockerfile</text>
      <rect class="box file" x="1012" y="758" width="138" height="56" rx="6"/>
      <text class="t" x="1081" y="781" text-anchor="middle">scripts/backup.sh</text>
      <text class="s" x="1081" y="799" text-anchor="middle">pg_dump → ~/backups</text>

      <line class="ln" x1="595" y1="756" x2="595" y2="698" marker-end="url(#d)"/>
      <text class="lb" x="603" y="720">env_file</text>
      <line class="ln" x1="759" y1="756" x2="759" y2="698" marker-end="url(#d)"/>
      <text class="lb" x="767" y="720">read-only mount</text>
      <line class="ln" x1="923" y1="756" x2="923" y2="698" marker-end="url(#d)"/>
      <text class="lb" x="931" y="720">docker build</text>
      <line class="ln" x1="264" y1="765" x2="337" y2="765" marker-start="url(#d)" marker-end="url(#d)"/>
      <text class="lb" x="300" y="758" text-anchor="middle">SSH :22</text>
    </svg>
