<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-label="Sequence: a member opens the team's secret link in a browser. The page calls GET api/state through Caddy and http/web.py; WebUseCases.page looks the team up by its token and reads the unpaid bills from PostgreSQL, and the page lists names and amounts. The member ticks names and the page calls POST api/pay; create_intent saves an intent with a TF code and returns the VietQR, bank and amount. The member pays in their banking app. SePay calls POST /sepay/{team}; record_transfer marks the bills and the intent paid and the bot posts in the team group. Meanwhile the page polls GET api/pay/{code} every 4 seconds and shows paid when the status changes."><style>svg{
  --bg:#f5f7f8; --surface:#ffffff; --fg:#17212b; --muted:#5b6b78; --line:#c9d3db;
  --tg:#2b7bb9; --tg-soft:#eaf3fa; --money:#b8730f; --money-soft:#fbf1df;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
;color:var(--fg);font-family:Inter,system-ui,sans-serif}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.box.tg{stroke:var(--tg)}
.box.in{fill:var(--tg-soft);stroke:var(--tg);stroke-width:1}
.box.mo{stroke:var(--money);fill:var(--money-soft)}
.box.ghost{fill:none;stroke:var(--line);stroke-dasharray:4 3}
.box.hot{fill:var(--tg-soft);stroke:var(--tg);stroke-width:2}
.box.file{fill:var(--bg);stroke:var(--line)}
.lane{fill:var(--bg);stroke:none}
.lane-line{stroke:var(--line);stroke-width:1}
.ln.tg{stroke:var(--tg)}
.ln.out{stroke:var(--tg);stroke-dasharray:6 4}
.head-tg{fill:var(--tg)}
.lb.tgc{fill:var(--tg)}
.s.ghost{fill:var(--muted);font-style:italic}
.zone{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 5}
.zone.tg{stroke:var(--tg)}
.t{font:600 13px var(--body);fill:currentColor}
.s{font:400 11px var(--body);fill:var(--muted)}
.lb{font:500 11px var(--mono);fill:var(--muted)}
.lb.m{fill:var(--money)}
.lb.z{fill:var(--tg)}
.ln{fill:none;stroke:currentColor;stroke-width:1.4}
.ln.m{stroke:var(--money);stroke-width:2}
.ln.d{stroke-dasharray:5 4}
.life{stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 4}
.head-fg{fill:currentColor}
.head-m{fill:var(--money)}</style><rect width="100%" height="100%" fill="#ffffff"/>
      <defs>
        <marker id="wpH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="head-fg"/></marker>
        <marker id="wpM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="head-m"/></marker>
        <marker id="wpT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="head-tg"/></marker>
      </defs>
      <rect class="box mo" x="10" y="12" width="140" height="44" rx="8"/><text class="t" x="80" y="31" text-anchor="middle">Member's browser</text><text class="s" x="80" y="47" text-anchor="middle">/p/{token}/ · PWA</text>
      <rect class="box" x="225" y="12" width="150" height="44" rx="8"/><text class="t" x="300" y="31" text-anchor="middle">Caddy → web.py</text><text class="s" x="300" y="47" text-anchor="middle">interfaces/http</text>
      <rect class="box hot" x="445" y="12" width="150" height="44" rx="8"/><text class="t" x="520" y="31" text-anchor="middle">use cases</text><text class="s" x="520" y="47" text-anchor="middle">WebUseCases · Money</text>
      <rect class="box" x="650" y="12" width="140" height="44" rx="8"/><text class="t" x="720" y="31" text-anchor="middle">PostgreSQL</text><text class="s" x="720" y="47" text-anchor="middle">same data as the bots</text>
      <rect class="box mo" x="840" y="12" width="140" height="44" rx="8"/><text class="t" x="910" y="31" text-anchor="middle">SePay</text><text class="s" x="910" y="47" text-anchor="middle">bank → webhook</text>
      <line class="life" x1="80" y1="56" x2="80" y2="530"/>
      <line class="life" x1="300" y1="56" x2="300" y2="530"/>
      <line class="life" x1="520" y1="56" x2="520" y2="530"/>
      <line class="life" x1="720" y1="56" x2="720" y2="530"/>
      <line class="life" x1="910" y1="56" x2="910" y2="530"/>

      <line class="ln" x1="80" y1="100" x2="298" y2="100" marker-end="url(#wpH)"/>
      <text class="lb" x="190" y="93" text-anchor="middle">GET api/state</text>
      <line class="ln" x1="300" y1="100" x2="518" y2="100" marker-end="url(#wpH)"/>
      <text class="lb" x="410" y="93" text-anchor="middle">page(token)</text>
      <line class="ln" x1="520" y1="100" x2="718" y2="100" marker-end="url(#wpH)"/>
      <text class="lb" x="620" y="93" text-anchor="middle">team by token, unpaid</text>
      <line class="ln d" x1="300" y1="138" x2="82" y2="138" marker-end="url(#wpH)"/>
      <text class="lb" x="190" y="131" text-anchor="middle">names + amounts</text>

      <line class="ln m" x1="80" y1="190" x2="298" y2="190" marker-end="url(#wpM)"/>
      <text class="lb m" x="190" y="183" text-anchor="middle">POST api/pay {member_ids}</text>
      <line class="ln m" x1="300" y1="190" x2="518" y2="190" marker-end="url(#wpM)"/>
      <text class="lb m" x="410" y="183" text-anchor="middle">create_intent</text>
      <line class="ln m" x1="520" y1="190" x2="718" y2="190" marker-end="url(#wpM)"/>
      <text class="lb m" x="620" y="183" text-anchor="middle">intent + TF code</text>
      <line class="ln d" x1="300" y1="228" x2="82" y2="228" marker-end="url(#wpH)"/>
      <text class="lb" x="190" y="221" text-anchor="middle">VietQR, SEVQR TF…, bank</text>

      <rect class="box file" x="12" y="250" width="136" height="40" rx="6"/>
      <text class="s" x="80" y="268" text-anchor="middle">pays in their</text>
      <text class="s" x="80" y="283" text-anchor="middle">banking app</text>

      <line class="ln m" x1="910" y1="330" x2="522" y2="330" marker-end="url(#wpM)"/>
      <text class="lb m" x="715" y="323" text-anchor="middle">POST /sepay/{team} → record_transfer</text>
      <line class="ln m" x1="520" y1="366" x2="718" y2="366" marker-end="url(#wpM)"/>
      <text class="lb m" x="620" y="359" text-anchor="middle">bills + intent paid</text>
      <line class="ln tg" x1="520" y1="400" x2="598" y2="400" marker-end="url(#wpT)"/>
      <text class="lb tgc" x="604" y="404">→ post in the team group</text>

      <line class="ln" x1="80" y1="450" x2="298" y2="450" marker-end="url(#wpH)"/>
      <text class="lb" x="190" y="443" text-anchor="middle">GET api/pay/{code}, every 4 s</text>
      <line class="ln" x1="300" y1="450" x2="518" y2="450" marker-end="url(#wpH)"/>
      <text class="lb" x="410" y="443" text-anchor="middle">intent_status</text>
      <line class="ln d" x1="300" y1="492" x2="82" y2="492" marker-end="url(#wpH)"/>
      <text class="lb" x="190" y="485" text-anchor="middle">paid → ✅ screen</text>
    </svg>
