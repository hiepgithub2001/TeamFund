<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="240" viewBox="0 0 1010 240" role="img" aria-label="One day of scheduled jobs in team time. Every hour at minute 5, open_month creates the month's bills and announces each package on its announcement day; every hour at minute 10, matches fills repeating calendars 8 weeks ahead; every hour at minute 30, clean_up expires old QR codes and manager requests. Once a day: 00:05 late_fees adds the new day to overdue bills' late fees, 09:00 remind sends one reminder to followers when a package is due soon or overdue, and matches tells managers about a match in 7 days with no opponent; 18:00 matches reminds followers of tomorrow's matches. When the server starts, open_month, late_fees and matches run once right away."><style>svg{
  --bg:#f5f7f8; --surface:#ffffff; --fg:#17212b; --muted:#5b6b78; --line:#c9d3db;
  --tg:#2b7bb9; --tg-soft:#eaf3fa; --money:#b8730f; --money-soft:#fbf1df;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
;color:var(--fg);font-family:Inter,system-ui,sans-serif}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.box.tg{stroke:var(--tg)}
.box.in{fill:var(--tg-soft);stroke:var(--tg);stroke-width:1}
.box.mo{stroke:var(--money);fill:var(--money-soft)}
.box.ghost{fill:none;stroke:var(--line);stroke-dasharray:4 3}
.box.hot{fill:var(--tg-soft);stroke:var(--tg);stroke-width:2}
.box.file{fill:var(--bg);stroke:var(--line)}
.lane{fill:var(--bg);stroke:none}
.lane-line{stroke:var(--line);stroke-width:1}
.ln.tg{stroke:var(--tg)}
.ln.out{stroke:var(--tg);stroke-dasharray:6 4}
.head-tg{fill:var(--tg)}
.lb.tgc{fill:var(--tg)}
.s.ghost{fill:var(--muted);font-style:italic}
.zone{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 5}
.zone.tg{stroke:var(--tg)}
.t{font:600 13px var(--body);fill:currentColor}
.s{font:400 11px var(--body);fill:var(--muted)}
.lb{font:500 11px var(--mono);fill:var(--muted)}
.lb.m{fill:var(--money)}
.lb.z{fill:var(--tg)}
.ln{fill:none;stroke:currentColor;stroke-width:1.4}
.ln.dash{stroke-dasharray:3 3;opacity:.6}
.ln.m{stroke:var(--money);stroke-width:2}
.ln.d{stroke-dasharray:5 4}
.life{stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 4}
.head-fg{fill:currentColor}
.head-m{fill:var(--money)}</style><rect width="100%" height="100%" fill="#ffffff"/>
      <line class="life" x1="150" y1="40" x2="150" y2="222"/><text class="lb" x="150" y="32" text-anchor="middle">00:00</text><line class="life" x1="255" y1="40" x2="255" y2="222"/><text class="lb" x="255" y="32" text-anchor="middle">03:00</text><line class="life" x1="360" y1="40" x2="360" y2="222"/><text class="lb" x="360" y="32" text-anchor="middle">06:00</text><line class="life" x1="465" y1="40" x2="465" y2="222"/><text class="lb" x="465" y="32" text-anchor="middle">09:00</text><line class="life" x1="570" y1="40" x2="570" y2="222"/><text class="lb" x="570" y="32" text-anchor="middle">12:00</text><line class="life" x1="675" y1="40" x2="675" y2="222"/><text class="lb" x="675" y="32" text-anchor="middle">15:00</text><line class="life" x1="780" y1="40" x2="780" y2="222"/><text class="lb" x="780" y="32" text-anchor="middle">18:00</text><line class="life" x1="885" y1="40" x2="885" y2="222"/><text class="lb" x="885" y="32" text-anchor="middle">21:00</text><line class="life" x1="990" y1="40" x2="990" y2="222"/><text class="lb" x="990" y="32" text-anchor="middle">24:00</text>
      <text class="t" x="20" y="72">Every hour</text>
      <text class="s" x="20" y="88">:05 open_month · :10 matches</text>
      <text class="s" x="20" y="102">:30 clean_up (dashed)</text>
      <line class="ln" x1="152.9" y1="64" x2="152.9" y2="84"/><line class="ln" x1="187.9" y1="64" x2="187.9" y2="84"/><line class="ln" x1="222.9" y1="64" x2="222.9" y2="84"/><line class="ln" x1="257.9" y1="64" x2="257.9" y2="84"/><line class="ln" x1="292.9" y1="64" x2="292.9" y2="84"/><line class="ln" x1="327.9" y1="64" x2="327.9" y2="84"/><line class="ln" x1="362.9" y1="64" x2="362.9" y2="84"/><line class="ln" x1="397.9" y1="64" x2="397.9" y2="84"/><line class="ln" x1="432.9" y1="64" x2="432.9" y2="84"/><line class="ln" x1="467.9" y1="64" x2="467.9" y2="84"/><line class="ln" x1="502.9" y1="64" x2="502.9" y2="84"/><line class="ln" x1="537.9" y1="64" x2="537.9" y2="84"/><line class="ln" x1="572.9" y1="64" x2="572.9" y2="84"/><line class="ln" x1="607.9" y1="64" x2="607.9" y2="84"/><line class="ln" x1="642.9" y1="64" x2="642.9" y2="84"/><line class="ln" x1="677.9" y1="64" x2="677.9" y2="84"/><line class="ln" x1="712.9" y1="64" x2="712.9" y2="84"/><line class="ln" x1="747.9" y1="64" x2="747.9" y2="84"/><line class="ln" x1="782.9" y1="64" x2="782.9" y2="84"/><line class="ln" x1="817.9" y1="64" x2="817.9" y2="84"/><line class="ln" x1="852.9" y1="64" x2="852.9" y2="84"/><line class="ln" x1="887.9" y1="64" x2="887.9" y2="84"/><line class="ln" x1="922.9" y1="64" x2="922.9" y2="84"/><line class="ln" x1="957.9" y1="64" x2="957.9" y2="84"/>
      <line class="ln dash" x1="167.5" y1="64" x2="167.5" y2="84"/><line class="ln dash" x1="202.5" y1="64" x2="202.5" y2="84"/><line class="ln dash" x1="237.5" y1="64" x2="237.5" y2="84"/><line class="ln dash" x1="272.5" y1="64" x2="272.5" y2="84"/><line class="ln dash" x1="307.5" y1="64" x2="307.5" y2="84"/><line class="ln dash" x1="342.5" y1="64" x2="342.5" y2="84"/><line class="ln dash" x1="377.5" y1="64" x2="377.5" y2="84"/><line class="ln dash" x1="412.5" y1="64" x2="412.5" y2="84"/><line class="ln dash" x1="447.5" y1="64" x2="447.5" y2="84"/><line class="ln dash" x1="482.5" y1="64" x2="482.5" y2="84"/><line class="ln dash" x1="517.5" y1="64" x2="517.5" y2="84"/><line class="ln dash" x1="552.5" y1="64" x2="552.5" y2="84"/><line class="ln dash" x1="587.5" y1="64" x2="587.5" y2="84"/><line class="ln dash" x1="622.5" y1="64" x2="622.5" y2="84"/><line class="ln dash" x1="657.5" y1="64" x2="657.5" y2="84"/><line class="ln dash" x1="692.5" y1="64" x2="692.5" y2="84"/><line class="ln dash" x1="727.5" y1="64" x2="727.5" y2="84"/><line class="ln dash" x1="762.5" y1="64" x2="762.5" y2="84"/><line class="ln dash" x1="797.5" y1="64" x2="797.5" y2="84"/><line class="ln dash" x1="832.5" y1="64" x2="832.5" y2="84"/><line class="ln dash" x1="867.5" y1="64" x2="867.5" y2="84"/><line class="ln dash" x1="902.5" y1="64" x2="902.5" y2="84"/><line class="ln dash" x1="937.5" y1="64" x2="937.5" y2="84"/><line class="ln dash" x1="972.5" y1="64" x2="972.5" y2="84"/>
      <text class="t" x="20" y="146">Every day</text>
      <circle class="box mo" cx="152.9" cy="140" r="7"/><text class="t" x="164.9" y="144">late_fees</text><text class="s" x="164.9" y="159">+1 day of fines</text>
      <circle class="box mo" cx="465.0" cy="140" r="7"/><text class="t" x="477.0" y="144">remind</text><text class="s" x="477.0" y="159">3 days before, on, every 3 days after</text>
      <circle class="box mo" cx="465.0" cy="180" r="7"/><text class="t" x="477.0" y="184">matches</text><text class="s" x="477.0" y="199">managers: no opponent in 7 days</text>
      <circle class="box mo" cx="780.0" cy="180" r="7"/><text class="t" x="792.0" y="184">matches</text><text class="s" x="792.0" y="199">followers: tomorrow's match</text>
      <text class="t" x="20" y="214">On start</text>
      <text class="s" x="162" y="214">open_month, late_fees and matches run once, so a restart never skips a day or a month</text>
    </svg>
