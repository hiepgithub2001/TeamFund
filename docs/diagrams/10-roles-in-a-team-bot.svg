<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-label="Sequence: a person sends /requestmanager to the team bot, a use case records the request and the bot sends the owner a card with Approve and Reject buttons. When the owner taps Approve, the use case checks that the tapper is the owner, adds the manager role and writes the audit log, then the bot tells the person and announces it."><style>svg{
  --bg:#f5f7f8; --surface:#ffffff; --fg:#17212b; --muted:#5b6b78; --line:#c9d3db;
  --tg:#2b7bb9; --tg-soft:#eaf3fa; --money:#b8730f; --money-soft:#fbf1df;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
;color:var(--fg);font-family:Inter,system-ui,sans-serif}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.box.tg{stroke:var(--tg)}
.box.in{fill:var(--tg-soft);stroke:var(--tg);stroke-width:1}
.box.mo{stroke:var(--money);fill:var(--money-soft)}
.box.ghost{fill:none;stroke:var(--line);stroke-dasharray:4 3}
.box.hot{fill:var(--tg-soft);stroke:var(--tg);stroke-width:2}
.box.file{fill:var(--bg);stroke:var(--line)}
.lane{fill:var(--bg);stroke:none}
.lane-line{stroke:var(--line);stroke-width:1}
.ln.tg{stroke:var(--tg)}
.ln.out{stroke:var(--tg);stroke-dasharray:6 4}
.head-tg{fill:var(--tg)}
.lb.tgc{fill:var(--tg)}
.s.ghost{fill:var(--muted);font-style:italic}
.zone{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 5}
.zone.tg{stroke:var(--tg)}
.t{font:600 13px var(--body);fill:currentColor}
.s{font:400 11px var(--body);fill:var(--muted)}
.lb{font:500 11px var(--mono);fill:var(--muted)}
.lb.m{fill:var(--money)}
.lb.z{fill:var(--tg)}
.ln{fill:none;stroke:currentColor;stroke-width:1.4}
.ln.dash{stroke-dasharray:3 3;opacity:.6}
.ln.m{stroke:var(--money);stroke-width:2}
.ln.d{stroke-dasharray:5 4}
.life{stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 4}
.head-fg{fill:currentColor}
.head-m{fill:var(--money)}</style><rect width="100%" height="100%" fill="#ffffff"/>
      <defs>
        <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="head-fg"/></marker>
      </defs>
      <rect class="box" x="25" y="16" width="130" height="40" rx="8"/><text class="t" x="90" y="41" text-anchor="middle">Person</text>
      <rect class="box tg" x="235" y="16" width="130" height="40" rx="8"/><text class="t" x="300" y="41" text-anchor="middle">Team bot</text>
      <rect class="box" x="445" y="16" width="130" height="40" rx="8"/><text class="t" x="510" y="41" text-anchor="middle">Use cases</text>
      <rect class="box" x="655" y="16" width="130" height="40" rx="8"/><text class="t" x="720" y="41" text-anchor="middle">Owner</text>
      <line class="life" x1="90" y1="56" x2="90" y2="385"/>
      <line class="life" x1="300" y1="56" x2="300" y2="385"/>
      <line class="life" x1="510" y1="56" x2="510" y2="385"/>
      <line class="life" x1="720" y1="56" x2="720" y2="385"/>

      <line class="ln" x1="90" y1="92" x2="298" y2="92" marker-end="url(#c)"/>
      <text class="lb" x="195" y="85" text-anchor="middle">1 · /requestmanager</text>
      <line class="ln" x1="300" y1="128" x2="508" y2="128" marker-end="url(#c)"/>
      <text class="lb" x="405" y="121" text-anchor="middle">2 · create request</text>
      <polyline class="ln" points="510,148 550,148 550,170 513,170" marker-end="url(#c)"/>
      <text class="lb" x="558" y="157">3 · 1 pending max,</text>
      <text class="lb" x="558" y="171">24h cooldown</text>
      <line class="ln" x1="300" y1="206" x2="718" y2="206" marker-end="url(#c)"/>
      <text class="lb" x="510" y="199" text-anchor="middle">4 · request card [✅ Approve] [❌ Reject]</text>
      <line class="ln" x1="720" y1="242" x2="302" y2="242" marker-end="url(#c)"/>
      <text class="lb" x="510" y="235" text-anchor="middle">5 · taps ✅ Approve</text>
      <line class="ln" x1="300" y1="278" x2="508" y2="278" marker-end="url(#c)"/>
      <text class="lb" x="405" y="271" text-anchor="middle">6 · approve, actor = tapper ID</text>
      <polyline class="ln" points="510,298 550,298 550,320 513,320" marker-end="url(#c)"/>
      <text class="lb" x="558" y="307">7 · tapper is owner? add</text>
      <text class="lb" x="558" y="321">manager, write audit log</text>
      <line class="ln" x1="300" y1="360" x2="92" y2="360" marker-end="url(#c)"/>
      <text class="lb" x="195" y="353" text-anchor="middle">8 · "You're a manager" + announcement</text>
    </svg>
