<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="470" viewBox="0 0 1060 470" role="img" aria-label="Deploy pipeline in four lanes: change and test the code, commit, push to GitHub over SSH, on the VPS run deploy.sh which pulls main and runs docker compose build, then compose up recreates changed containers, the gateway reconnects every bot's webhook, and the script checks the public health URL. A rollback runs deploy.sh with an older commit."><style>svg{
  --bg:#f5f7f8; --surface:#ffffff; --fg:#17212b; --muted:#5b6b78; --line:#c9d3db;
  --tg:#2b7bb9; --tg-soft:#eaf3fa; --money:#b8730f; --money-soft:#fbf1df;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
;color:var(--fg);font-family:Inter,system-ui,sans-serif}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.box.tg{stroke:var(--tg)}
.box.in{fill:var(--tg-soft);stroke:var(--tg);stroke-width:1}
.box.mo{stroke:var(--money);fill:var(--money-soft)}
.box.ghost{fill:none;stroke:var(--line);stroke-dasharray:4 3}
.box.hot{fill:var(--tg-soft);stroke:var(--tg);stroke-width:2}
.box.file{fill:var(--bg);stroke:var(--line)}
.lane{fill:var(--bg);stroke:none}
.lane-line{stroke:var(--line);stroke-width:1}
.ln.tg{stroke:var(--tg)}
.ln.out{stroke:var(--tg);stroke-dasharray:6 4}
.head-tg{fill:var(--tg)}
.lb.tgc{fill:var(--tg)}
.s.ghost{fill:var(--muted);font-style:italic}
.zone{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 5}
.zone.tg{stroke:var(--tg)}
.t{font:600 13px var(--body);fill:currentColor}
.s{font:400 11px var(--body);fill:var(--muted)}
.lb{font:500 11px var(--mono);fill:var(--muted)}
.lb.m{fill:var(--money)}
.lb.z{fill:var(--tg)}
.ln{fill:none;stroke:currentColor;stroke-width:1.4}
.ln.m{stroke:var(--money);stroke-width:2}
.ln.d{stroke-dasharray:5 4}
.life{stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 4}
.head-fg{fill:currentColor}
.head-m{fill:var(--money)}</style><rect width="100%" height="100%" fill="#ffffff"/>
      <defs>
        <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="head-fg"/></marker>
      </defs>
      <rect class="lane" x="0" y="10" width="1060" height="100"/>
      <rect class="lane" x="0" y="190" width="1060" height="100"/>
      <line class="lane-line" x1="0" y1="110" x2="1060" y2="110"/>
      <line class="lane-line" x1="0" y1="190" x2="1060" y2="190"/>
      <line class="lane-line" x1="0" y1="290" x2="1060" y2="290"/>
      <text class="lb" x="12" y="56">CODE</text>
      <text class="s" x="12" y="72">VPS or laptop</text>
      <text class="lb" x="12" y="148">GITHUB</text>
      <text class="lb" x="12" y="236">VPS HOST</text>
      <text class="s" x="12" y="252">scripts/deploy.sh</text>
      <text class="lb" x="12" y="370">DOCKER</text>
      <text class="s" x="12" y="386">Compose</text>

      <rect class="box" x="170" y="32" width="150" height="56" rx="8"/>
      <text class="t" x="245" y="55" text-anchor="middle">1 · change + test</text>
      <text class="s" x="245" y="73" text-anchor="middle">pytest, npm test, e2e</text>
      <rect class="box" x="340" y="32" width="150" height="56" rx="8"/>
      <text class="t" x="415" y="55" text-anchor="middle">2 · git commit</text>
      <text class="s" x="415" y="73" text-anchor="middle">on branch main</text>
      <rect class="box" x="510" y="122" width="150" height="56" rx="8"/>
      <text class="t" x="585" y="145" text-anchor="middle">3 · git push</text>
      <text class="s" x="585" y="163" text-anchor="middle">SSH key id_ed25519_github</text>
      <rect class="box" x="680" y="212" width="150" height="56" rx="8"/>
      <text class="t" x="755" y="235" text-anchor="middle">4 · git pull --ff-only</text>
      <text class="s" x="755" y="253" text-anchor="middle">refuses diverged history</text>
      <rect class="box" x="850" y="212" width="150" height="56" rx="8"/>
      <text class="t" x="925" y="235" text-anchor="middle">5 · compose build</text>
      <text class="s" x="925" y="253" text-anchor="middle">--pull fresh base images</text>
      <rect class="box tg" x="850" y="318" width="150" height="70" rx="8"/>
      <text class="t" x="925" y="341" text-anchor="middle">6 · compose up -d</text>
      <text class="s" x="925" y="359" text-anchor="middle">recreates changed</text>
      <text class="s" x="925" y="374" text-anchor="middle">containers; volumes kept</text>
      <rect class="box tg" x="680" y="318" width="150" height="70" rx="8"/>
      <text class="t" x="755" y="341" text-anchor="middle">7 · gateway boots</text>
      <text class="s" x="755" y="359" text-anchor="middle">loads bots from core,</text>
      <text class="s" x="755" y="374" text-anchor="middle">setWebhook for each</text>
      <rect class="box" x="510" y="318" width="150" height="70" rx="8"/>
      <text class="t" x="585" y="341" text-anchor="middle">8 · health check</text>
      <text class="s" x="585" y="359" text-anchor="middle">curl https://…/health</text>
      <text class="s" x="585" y="374" text-anchor="middle">then compose ps</text>

      <rect class="box ghost" x="170" y="212" width="190" height="56" rx="8"/>
      <text class="t" x="265" y="235" text-anchor="middle">Rollback</text>
      <text class="s" x="265" y="253" text-anchor="middle">scripts/deploy.sh &lt;commit&gt;</text>

      <rect class="box file" x="170" y="318" width="300" height="130" rx="8"/>
      <text class="t" x="186" y="340">Start order inside Compose</text>
      <text class="s" x="186" y="360">db → healthy (pg_isready)</text>
      <text class="s" x="186" y="377">core, scheduler → create tables, start</text>
      <text class="s" x="186" y="394">gateway → waits for core, loads bots</text>
      <text class="s" x="186" y="411">caddy → certificate on first start</text>
      <text class="s" x="186" y="428">restart: unless-stopped on all five</text>

      <line class="ln" x1="322" y1="60" x2="337" y2="60" marker-end="url(#p)"/>
      <polyline class="ln" points="415,90 415,150 507,150" marker-end="url(#p)"/>
      <text class="lb" x="423" y="140">SSH :22</text>
      <polyline class="ln" points="662,150 755,150 755,209" marker-end="url(#p)"/>
      <text class="lb" x="763" y="185">pull main</text>
      <line class="ln" x1="832" y1="240" x2="847" y2="240" marker-end="url(#p)"/>
      <line class="ln" x1="925" y1="270" x2="925" y2="315" marker-end="url(#p)"/>
      <line class="ln" x1="848" y1="353" x2="833" y2="353" marker-end="url(#p)"/>
      <line class="ln" x1="678" y1="353" x2="663" y2="353" marker-end="url(#p)"/>
      <polyline class="ln d" points="362,240 600,240 600,232 677,232" marker-end="url(#p)"/>
      <text class="lb" x="480" y="233" text-anchor="middle">git checkout &lt;sha&gt;</text>
    </svg>
